# Coolify (Docker Compose build pack) deployment of the whole DMS: web app, API and PostgreSQL, with
# ClamAV as an OPTIONAL extra. Set the variables below in the Coolify "Environment Variables" screen;
# none has a usable default for secrets. See docs/deployment/COOLIFY_DEPLOYMENT.md.
#
# Only the `web` service is public (give it your domain, port 8080). It serves the pages and forwards
# /api to the `api` service, so the browser sees one address and no cross-site settings are needed.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "8080"
    environment:
      NGINX_MAX_BODY: ${NGINX_MAX_BODY:-110m}

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # The password goes in as its own value (never inside a URL), so it may contain @ : / % # ? and so on.
      POSTGRES_HOST: postgres
      POSTGRES_USER: dms
      POSTGRES_DB: dms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (32+ random characters)}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL (the public address of the web app)}
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL (the same address as APP_BASE_URL)}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-backblaze}
      DMS_B2_KEY_ID: ${DMS_B2_KEY_ID:-}
      DMS_B2_APP_KEY: ${DMS_B2_APP_KEY:-}
      DMS_B2_BUCKET_NAME: ${DMS_B2_BUCKET_NAME:-}
      # Virus scanning is optional for the first release. To turn it on: SCANNER_BACKEND=clamav,
      # ALLOW_UNSCANNED_UPLOADS=false, COMPOSE_PROFILES=scan (starts the clamav service below).
      SCANNER_BACKEND: ${SCANNER_BACKEND:-none}
      ALLOW_UNSCANNED_UPLOADS: ${ALLOW_UNSCANNED_UPLOADS:-true}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      SSO_GOOGLE_CLIENT_ID: ${SSO_GOOGLE_CLIENT_ID:-}
      SSO_MICROSOFT_CLIENT_ID: ${SSO_MICROSOFT_CLIENT_ID:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      DMS_MAX_UPLOAD_BYTES: ${DMS_MAX_UPLOAD_BYTES:-104857600}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      - dms_uploads_tmp:/data/uploads-tmp
      - dms_storage:/data/storage

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: dms
    volumes:
      - dms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional virus scanner (about 1 GB of memory). Not started unless COMPOSE_PROFILES includes "scan".
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    restart: unless-stopped
    volumes:
      - dms_clamav:/var/lib/clamav

volumes:
  dms_pgdata:
  dms_uploads_tmp:
  dms_storage:
  dms_clamav:
