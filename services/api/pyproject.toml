[project]
name = "dms-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
