# Local development only. Throwaway credentials; never reuse outside a developer machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms_dev
      POSTGRES_DB: dms
    ports:
      - "15432:5432"
    volumes:
      - dms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dms_pgdata:
