<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMS Design Showcase</title>
<style>
/* ===== Showcase chrome (not part of any design) ===== */
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,sans-serif;background:#1b1f2a}
#picker{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#0f1320;color:#dfe5f5;border-bottom:1px solid #2a3145}
#picker b{font-size:15px;margin-right:8px;white-space:nowrap}
#picker button{border:1px solid #333c57;background:#171d30;color:#cfd7ee;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;display:flex;gap:8px;align-items:center}
#picker button[aria-pressed=true]{background:#e8edff;color:#10172b;border-color:#e8edff;font-weight:600}
#picker i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.3)}
#picker .sp{flex:1}
#stage{height:calc(100vh - 56px);overflow:hidden;position:relative}
#jsonpane{position:absolute;right:0;top:0;bottom:0;width:420px;background:#0b0f1a;color:#b9c6f0;font:12px/1.5 Consolas,monospace;padding:14px;overflow:auto;display:none;z-index:50;border-left:1px solid #2a3145;white-space:pre}
#jsonpane.on{display:block}

/* ===== Design tokens (set from the template JSON) ===== */
#app{--primary:#1d4ed8;--secondary:#0ea5e9;--bg:#f3f6fb;--surface:#fff;--text:#0f172a;--text2:#475569;--border:#e2e8f0;
--success:#15803d;--warning:#b45309;--error:#b91c1c;--info:#0369a1;--radius:6px;--shadow:none;--font:system-ui;--scale:1;--gap:24px;--sw:248px;
--row-pad:10px;--ctl-h:36px;--card-pad:18px;--hw:600;--tint:color-mix(in srgb,var(--primary) 10%,transparent);--tint2:color-mix(in srgb,var(--primary) 18%,transparent);
height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:var(--font);font-size:calc(14px*var(--scale));overflow:auto;transition:background .2s}
#app *{box-sizing:border-box}
#app[data-density=compact]{--row-pad:4px;--ctl-h:28px;--card-pad:12px}
#app[data-density=spacious]{--row-pad:16px;--ctl-h:44px;--card-pad:28px}
#app h1,#app h2,#app h3{margin:0;font-weight:var(--hw)}
#app h1{font-size:1.65em}#app h2{font-size:1.2em}#app h3{font-size:1em}
#app .muted{color:var(--text2)}#app .small{font-size:.86em}
#app a{color:var(--primary);text-decoration:none}
#app svg.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app .row{display:flex;align-items:center;gap:10px}#app .between{justify-content:space-between}#app .grow{flex:1;min-width:0}
#app .stack{display:flex;flex-direction:column;gap:var(--gap)}

/* ===== Shell ===== */
#app .shell{flex:1;display:grid;min-height:0}
#app .main{display:flex;flex-direction:column;min-width:0;min-height:0}
#app .page{padding:var(--gap);overflow:auto;flex:1}
#app[data-width=contained] .page>.inner{max-width:1180px;margin:0 auto}
#app[data-width=narrow] .page>.inner{max-width:900px;margin:0 auto}
#app .side{display:flex;flex-direction:column;gap:6px;padding:14px 10px;background:var(--surface);border-right:1px solid var(--border)}
#app .brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:6px 10px 14px;font-size:1.1em}
#app .logo{width:30px;height:30px;border-radius:calc(var(--radius) + 2px);background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9em}
#app .nav{display:flex;flex-direction:column;gap:2px}
#app .nav a{display:flex;align-items:center;gap:12px;padding:calc(var(--row-pad) - 1px) 12px;border-radius:var(--radius);color:var(--text2);cursor:pointer;font-weight:500}
#app .nav a:hover{background:var(--tint)}
#app .nav a.on{background:var(--tint2);color:var(--primary);font-weight:600}
#app .navsec{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);padding:12px 12px 4px;opacity:.8}
#app .userbox{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--border)}
#app .av{width:30px;height:30px;border-radius:50%;background:var(--secondary);color:#fff;display:grid;place-items:center;font-size:.8em;font-weight:700;flex:none}
#app .head{display:flex;align-items:center;gap:14px;padding:12px var(--gap);background:var(--surface);border-bottom:1px solid var(--border)}
#app .searchbox{display:flex;align-items:center;gap:8px;flex:1;max-width:520px;height:var(--ctl-h);padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);background:var(--bg)}
#app .iconbtn{width:var(--ctl-h);height:var(--ctl-h);display:grid;place-items:center;border-radius:var(--radius);color:var(--text2);position:relative}
#app .iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--error)}

/* sidebar variants */
#app[data-sidebar=full] .shell{grid-template-columns:var(--sw) 1fr}
#app[data-sidebar=floating] .shell{grid-template-columns:calc(var(--sw) + 16px) 1fr;padding:16px 16px 16px 0}
#app[data-sidebar=floating]{background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--secondary) 10%,var(--bg)))}
#app[data-sidebar=floating] .side{margin:0 0 0 16px;border:0;border-radius:calc(var(--radius) + 6px);box-shadow:var(--shadow);height:100%}
#app[data-sidebar=floating] .main{background:transparent}
#app[data-sidebar=floating] .head{background:transparent;border:0}
#app[data-sidebar=floating] .nav a.on{background:linear-gradient(120deg,var(--primary),color-mix(in srgb,var(--primary) 55%,var(--secondary)));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 35%,transparent)}
#app[data-sidebar=rail-tree] .shell{grid-template-columns:64px 236px 1fr}
#app[data-sidebar=rail-tree] .side{align-items:center;padding:10px 6px;background:#17323a;border:0;color:#bcd2d6}
#app[data-sidebar=rail-tree] .side .brand{padding:6px 0 10px}
#app[data-sidebar=rail-tree] .nav a{padding:10px;justify-content:center;color:#a8c3c8;border-radius:var(--radius)}
#app[data-sidebar=rail-tree] .nav a span{display:none}
#app[data-sidebar=rail-tree] .nav a.on{background:rgba(255,255,255,.14);color:#fff}
#app[data-sidebar=rail-tree] .userbox{border:0;padding:6px 0}
#app[data-sidebar=top] .shell{grid-template-columns:1fr}
#app[data-sidebar=top] .side{display:none}
#app[data-sidebar=full][data-mode=dark] .side{background:linear-gradient(180deg,#0e1730,#0a1020)}
#app .tree{background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;overflow:auto;display:none}
#app[data-sidebar=rail-tree] .tree{display:block}
#app .tree .t{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.95em}
#app .tree .t:hover{background:var(--tint)}#app .tree .t.on{background:var(--tint2);color:var(--primary);font-weight:600}
#app .tree .l1{padding-left:22px}#app .tree .l2{padding-left:38px}
#app .tree .cnt{margin-left:auto;color:var(--text2);font-size:.85em}
#app .topnav{display:none;align-items:center;gap:4px;padding:18px var(--gap) 6px;max-width:1000px;margin:0 auto;width:100%}
#app[data-sidebar=top] .topnav{display:flex;flex-wrap:nowrap}
#app .topnav .brand{padding:0 24px 0 0}
#app .topnav a{padding:6px 8px;white-space:nowrap;color:var(--text2);cursor:pointer;border-bottom:1.5px solid transparent;font-size:.95em}
#app .topnav a.on{color:var(--text);border-color:var(--text)}
#app .topnav .sp{flex:1}

/* ===== Component variants ===== */
#app .card{background:var(--surface);border-radius:var(--radius);padding:var(--card-pad);min-width:0}
#app[data-card=outlined] .card{border:1px solid var(--border)}
#app[data-card=elevated] .card{box-shadow:var(--shadow)}
#app[data-card=flat] .card{background:transparent;padding-left:0;padding-right:0;border-bottom:1px solid var(--border);border-radius:0}
#app[data-card=glass] .card{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(6px)}
#app[data-card=gradient] .card{background:linear-gradient(150deg,var(--surface) 55%,color-mix(in srgb,var(--primary) 7%,var(--surface)));border:1px solid var(--border);box-shadow:var(--shadow)}
#app .card>h3,#app .cardh{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#app .btn{display:inline-flex;align-items:center;gap:8px;height:var(--ctl-h);padding:0 16px;border-radius:var(--radius);border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
#app[data-button=solid] .btn.p,#app[data-button=pill] .btn.p{background:var(--primary);color:var(--surface);color:#fff}
#app[data-button=pill] .btn{border-radius:999px}
#app[data-button=pill] .btn.p{background:linear-gradient(120deg,var(--primary),color-mix(in srgb,var(--primary) 60%,var(--secondary)));box-shadow:0 6px 14px color-mix(in srgb,var(--primary) 30%,transparent)}
#app[data-button=soft] .btn.p{background:var(--tint2);color:var(--primary)}
#app[data-button=outline] .btn.p{background:transparent;color:var(--text);border-color:var(--text)}
#app .btn.g{background:transparent;color:var(--text2);border-color:var(--border)}
#app[data-button=soft] .btn.g{background:var(--tint);border-color:transparent;color:var(--text)}
#app .btn.d{background:transparent;color:var(--error);border-color:color-mix(in srgb,var(--error) 40%,transparent)}
#app .btn.ok{background:var(--success);color:#fff}
#app[data-button=outline] .btn.ok{background:transparent;color:var(--success);border-color:var(--success)}
#app[data-button=soft] .btn.ok{background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success)}
#app table{width:100%;border-collapse:collapse}
#app th{text-align:left;font-weight:600;color:var(--text2);font-size:.82em;text-transform:uppercase;letter-spacing:.04em;padding:var(--row-pad) 12px}
#app td{padding:var(--row-pad) 12px;vertical-align:middle}
#app[data-table=zebra] tbody tr:nth-child(even){background:color-mix(in srgb,var(--primary) 4%,transparent)}
#app[data-table=zebra] thead th{border-bottom:2px solid var(--border)}
#app[data-table=zebra] tbody tr:hover{background:var(--tint)}
#app[data-table=plain] td,#app[data-table=plain] th{border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent)}
#app[data-table=lined] td{border-bottom:1px solid var(--border)}
#app[data-table=lined] tbody tr:hover{background:rgba(255,255,255,.04)}
#app[data-table=dense] td,#app[data-table=dense] th{border:1px solid var(--border);padding:var(--row-pad) 8px}
#app[data-table=dense] thead th{background:color-mix(in srgb,var(--primary) 7%,var(--surface))}
#app[data-table=dense] tbody tr:hover{background:var(--tint)}
#app .tw{overflow:auto}
#app .field{display:flex;flex-direction:column;gap:5px;min-width:0}
#app .field label{font-size:.82em;color:var(--text2);font-weight:600}
#app .inp,#app select.inp{height:var(--ctl-h);padding:0 12px;font:inherit;color:var(--text);width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);outline:none}
#app textarea.inp{height:auto;padding:10px 12px}
#app[data-input=filled] .inp{background:var(--tint);border-color:transparent;border-bottom:1.5px solid var(--border)}
#app[data-input=underline] .inp{border:0;border-bottom:1px solid var(--text2);border-radius:0;padding-left:0;background:transparent}
#app[data-dropdown=filled] select.inp{background:var(--tint)}
#app[data-dropdown=underline] select.inp{border:0;border-bottom:1px solid var(--text2);border-radius:0;padding-left:0;background:transparent}
#app select.inp option{color:#111}
#app .inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--tint)}
#app .tabs{display:flex;gap:4px;margin-bottom:16px}
#app .tabs a{padding:8px 14px;cursor:pointer;color:var(--text2);font-weight:600}
#app[data-tabs=underline] .tabs{border-bottom:1px solid var(--border)}
#app[data-tabs=underline] .tabs a{border-bottom:2px solid transparent;margin-bottom:-1px}
#app[data-tabs=underline] .tabs a.on{color:var(--primary);border-color:var(--primary)}
#app[data-tabs=pills] .tabs a{border-radius:999px}
#app[data-tabs=pills] .tabs a.on{background:var(--tint2);color:var(--primary)}
#app[data-tabs=segmented] .tabs{background:var(--tint);padding:4px;border-radius:calc(var(--radius) + 4px);width:max-content}
#app[data-tabs=segmented] .tabs a{border-radius:var(--radius)}
#app[data-tabs=segmented] .tabs a.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
#app .badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.82em;font-weight:600;white-space:nowrap}
#app .badge{--c:var(--info)}
#app .b-ok{--c:var(--success)}#app .b-wait{--c:var(--warning)}#app .b-bad{--c:var(--error)}#app .b-info{--c:var(--info)}#app .b-grey{--c:var(--text2)}
#app[data-badge=soft] .badge{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
#app[data-badge=filled] .badge{background:var(--c);color:#fff;border-radius:var(--radius)}
#app[data-badge=outlined] .badge{border:1px solid var(--c);color:var(--c);border-radius:var(--radius)}
#app[data-badge=dot] .badge{color:var(--text);background:color-mix(in srgb,var(--c) 10%,transparent)}
#app[data-badge=dot] .badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
#app .scrim{position:absolute;inset:0;background:rgba(5,10,25,.5);display:grid;place-items:center;z-index:20}
#app .dialog{background:var(--surface);width:480px;max-width:92%;padding:24px;display:flex;flex-direction:column;gap:14px;border-radius:var(--radius);box-shadow:0 20px 50px rgba(0,0,0,.35)}
#app[data-dialog=rounded] .dialog{border-radius:24px;border:1px solid var(--border)}
#app[data-dialog=flat] .dialog{box-shadow:none;border:1px solid var(--text)}
#app .chip{padding:4px 12px;border:1px solid var(--border);border-radius:999px;cursor:pointer;font-size:.9em;color:var(--text2);background:var(--surface)}
#app .chip.on{background:var(--tint2);color:var(--primary);border-color:transparent;font-weight:600}
#app .ftile{width:38px;height:44px;border-radius:calc(var(--radius) - 1px);display:grid;place-items:center;font-size:.72em;font-weight:800;color:#fff;flex:none;background:var(--primary)}
#app .t-pdf{background:#c0392b}#app .t-docx{background:#2b6cb0}#app .t-xlsx{background:#2f855a}#app .t-pptx{background:#c05621}#app .t-png{background:#6b46c1}
#app .bar{height:8px;background:var(--tint);border-radius:99px;overflow:hidden}#app .bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}

/* ===== Dashboard ===== */
#app .dgrid{display:grid;gap:var(--gap)}
#app .stat{display:flex;flex-direction:column;gap:6px;justify-content:center}
#app .stat .n{font-size:2em;font-weight:var(--hw);line-height:1.1}
#app .stat .lab{color:var(--text2);display:flex;align-items:center;gap:8px;font-weight:600}
#app .delta{font-size:.85em;color:var(--success);font-weight:600}#app .delta.dn{color:var(--error)}
#app[data-dl=focus-list] .dgrid .card{background:transparent;border:0;box-shadow:none;border-bottom:1px solid var(--border);border-radius:0;padding-left:0;padding-right:0}
#app[data-dl=focus-list] .stat .n{font-size:2.8em;font-weight:400}
#app[data-dl=focus-list] .hello{font-size:2.3em;font-weight:400;line-height:1.2;padding:20px 0 10px}
#app[data-dl=dark-hero] .hero{background:linear-gradient(135deg,#1f2f66,#2a3f86 45%,color-mix(in srgb,var(--secondary) 55%,#1f2f66));color:#fff;border:0;position:relative;overflow:hidden}
#app[data-dl=dark-hero] .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(242,184,75,.45),transparent 70%)}
#app[data-dl=dense-grid] .dgrid{gap:10px}
#app[data-dl=dense-grid] .stat .n{font-size:1.6em}
#app .hero h1{font-size:1.8em;margin-bottom:6px}
#app .list{display:flex;flex-direction:column}
#app .li{display:flex;align-items:center;gap:12px;padding:var(--row-pad) 0;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
#app .li:last-child{border:0}
#app .legend{display:flex;flex-direction:column;gap:6px;font-size:.9em}
#app .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
#app .kv{display:grid;grid-template-columns:140px 1fr;gap:10px 16px}
#app .kv dt{color:var(--text2)}#app .kv dd{margin:0}
#app .steps{display:flex;gap:0;align-items:flex-start}
#app .step{flex:1;text-align:center;position:relative;font-size:.85em;color:var(--text2)}
#app .step .c{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--tint);color:var(--text2);font-weight:700;position:relative;z-index:1}
#app .step.done .c{background:var(--success);color:#fff}#app .step.cur .c{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--tint2)}
#app .step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border)}
#app .step:first-child::before{display:none}#app .step.done::before,#app .step.cur::before{background:var(--success)}
#app .tl{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--border);margin-left:6px;padding-left:16px}
#app .tl>div{position:relative}#app .tl>div::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
#app .drop{border:2px dashed var(--border);border-radius:calc(var(--radius) + 4px);padding:36px;text-align:center;color:var(--text2);cursor:pointer;background:var(--tint)}
#app .drop:hover{border-color:var(--primary)}
#app .grid2{display:grid;gap:var(--gap);grid-template-columns:1fr 1fr}
#app .grid3{display:grid;gap:var(--gap);grid-template-columns:repeat(3,1fr)}
#app .grid4{display:grid;gap:var(--gap);grid-template-columns:repeat(4,1fr)}
#app .preview{aspect-ratio:3/4;max-height:420px;border-radius:var(--radius);background:linear-gradient(180deg,#fff,#f1f1f1);border:1px solid var(--border);padding:26px;color:#333;font-size:.8em;overflow:hidden}
#app .preview i{display:block;height:7px;background:#ddd;border-radius:3px;margin:9px 0}
#app mark{background:color-mix(in srgb,var(--secondary) 35%,transparent);color:inherit;border-radius:2px}
</style>
</head>
<body>
<div id="picker"></div>
<div id="stage"><div id="app"></div><div id="jsonpane"></div></div>

function bars(data,h=170){const w=480,mx=Math.max(...data)*1.1,bw=w/data.length;
 return `<svg viewBox="0 0 ${w} ${h+22}" width="100%" style="max-height:230px" role="img">${data.map((v,i)=>{const bh=v/mx*h;return `<rect x="${i*bw+bw*.18}" y="${h-bh}" width="${bw*.64}" height="${bh}" rx="3" fill="${i===data.length-1?'var(--ch1)':'var(--ch0)'}" opacity="${i===data.length-1?1:.85}"/><text x="${i*bw+bw/2}" y="${h+15}" text-anchor="middle" font-size="10" fill="var(--text2)">${MONTHS[i]}</text>`}).join("")}</svg>`}
function line(data,h=170){const w=480,mx=Math.max(...data)*1.1,st=w/(data.length-1);const pts=data.map((v,i)=>[i*st,h-v/mx*h]);
 const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
 return `<svg viewBox="0 0 ${w} ${h+22}" width="100%" style="max-height:230px"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ch0)" stop-opacity=".35"/><stop offset="1" stop-color="var(--ch0)" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#lg)"/><path d="${d}" fill="none" stroke="var(--ch0)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>i%3==0||i==pts.length-1?`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--surface)" stroke="var(--ch0)" stroke-width="2"/><text x="${p[0]}" y="${h+16}" text-anchor="middle" font-size="10" fill="var(--text2)">${MONTHS[i]}</text>`:"").join("")}</svg>`}
function donut(items,size=150){const tot=items.reduce((a,b)=>a+b[1],0);let acc=0;const r=52,c=2*Math.PI*r;
 const segs=items.map((it,i)=>{const len=it[1]/tot*c;const s=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="var(--ch${i})" stroke-width="18" stroke-dasharray="${len-2} ${c-len+2}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=len;return s}).join("");
 return `<div class="row" style="gap:18px;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="${size}" height="${size}">${segs}<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)">1,284</text><text x="70" y="86" text-anchor="middle" font-size="9" fill="var(--text2)">documents</text></svg><div class="legend">${items.map((it,i)=>`<div><i style="background:var(--ch${i})"></i>${it[0]} <b>${it[1]}%</b></div>`).join("")}</div></div>`}
function hbars(items){const mx=Math.max(...items.map(i=>i[1]));return `<div class="stack" style="gap:12px">${items.map((it,i)=>`<div><div class="row between small"><span>${it[0]}</span><b>${it[1]} GB</b></div><div class="bar"><i style="width:${it[1]/mx*100}%;background:var(--ch${i})"></i></div></div>`).join("")}</div>`}

function render(){
 const t=TEMPLATES[state.design],app=document.getElementById("app"),c=t.theme.colors,cm=t.components;
 const set={mode:t.theme.mode,sidebar:t.layout.sidebarVariant,density:DENS[t.density],width:t.layout.contentWidth,card:cm.card,button:cm.button,table:cm.table,input:cm.input,dropdown:cm.dropdown,tabs:cm.tabs,badge:cm.badge,dialog:cm.dialog,dl:t.pages.dashboard.layout};
 Object.entries(set).forEach(([k,v])=>app.dataset[k]=v);
 const v={primary:c.primary,secondary:c.secondary,bg:c.background,surface:c.surface,text:c.textPrimary,text2:c.textSecondary,border:c.border,success:c.success,warning:c.warning,error:c.error,info:c.info,radius:t.theme.radius+"px",shadow:SHADOWS[t.theme.shadow],font:FONTS[t.theme.typography.fontFamily],scale:t.theme.typography.scale,hw:t.theme.typography.headingWeight,gap:t.layout.pageSpacing+"px",sw:t.layout.sidebarWidth+"px"};
 Object.entries(v).forEach(([k,x])=>app.style.setProperty("--"+k,x));
 c.chart.forEach((x,i)=>app.style.setProperty("--ch"+i,x));
 const screen=SCREENS[state.screen](t),title=NAV.find(n=>n[0]===state.screen)[1];
 const nav=NAV.map(n=>`<a class="${n[0]===state.screen?"on":""}" data-go="${n[0]}" title="${n[1]}">${ic(n[2])}<span>${n[1]}</span></a>`).join("");
 const top=`<div class="topnav"><div class="brand"><div class="logo">D</div>DMS</div>${NAV.map(n=>`<a class="${n[0]===state.screen?"on":""}" data-go="${n[0]}">${n[1].replace("Document details","Details")}</a>`).join("")}<span class="sp"></span><div class="av">AK</div></div>`;
 const hv=t.layout.headerVariant;
 const bell=`<div class="iconbtn">${ic("bell")}<span class="dot"></span></div>`;
 const header=({search:`<div class="head"><div class="searchbox">${ic("search")}Search documents, people, tags…</div><span class="grow"></span>${bell}<div class="av">AK</div></div>`,
  minimal:t.layout.sidebarVariant==="top"?"":`<div class="head"><b style="font-size:1.05em">${title}</b><span class="grow"></span>${bell}<div class="av">AK</div></div>`,
  pill:`<div class="head"><div><div class="muted small">Demo Industries</div><b style="font-size:1.1em">Document workspace</b></div><span class="grow"></span><div class="searchbox" style="border-radius:999px;max-width:340px;background:var(--surface);box-shadow:var(--shadow);border:0">${ic("search")}Search…</div>${bell}<div class="av">AK</div></div>`,
  toolbar:`<div class="head" style="padding-top:8px;padding-bottom:8px"><span class="muted small">Demo Industries / ${title}</span><span class="grow"></span><div class="searchbox" style="max-width:300px">${ic("search")}Quick find (Ctrl+K)</div><button class="btn g">${ic("plus")}New</button><button class="btn p">${ic("upload")}Upload</button>${bell}<div class="av">AK</div></div>`})[hv];
 const side=`<aside class="side"><div class="brand"><div class="logo">D</div>${set.sidebar==="rail-tree"?"":"DMS"}</div><nav class="nav">${nav}</nav><div class="userbox"><div class="av">AK</div>${set.sidebar==="rail-tree"?"":`<div><b>Asha Kulkarni</b><div class="muted small">Administrator</div></div>`}</div></aside>`;
 app.innerHTML=`<div class="shell">${side}${set.sidebar==="rail-tree"?treePanel():""}<div class="main">${top}${header}<main class="page"><div class="inner">${screen}</div></main></div></div>${dialogHtml()}`;
 app.style.position="relative";
 document.getElementById("jsonpane").textContent=JSON.stringify(t,null,2);
 bind();
 const pk=document.getElementById("picker");
 pk.innerHTML=`<b>DMS design showcase</b>${TEMPLATES.map((x,i)=>`<button data-d="${i}" aria-pressed="${i==state.design}"><i style="background:${x.theme.colors.primary}"></i>${i+1}. ${x.name}</button>`).join("")}<span class="sp"></span><button id="jbtn" aria-pressed="${document.getElementById("jsonpane").classList.contains("on")}">{ } Template JSON</button>`;
 pk.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{state.design=+b.dataset.d;state.tab=0;location.hash=`d=${TEMPLATES[state.design].key}&s=${state.screen}`;render()});
 document.getElementById("jbtn").onclick=()=>{document.getElementById("jsonpane").classList.toggle("on");render()};
}
function bind(){
 const app=document.getElementById("app");
 app.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>{state.screen=e.dataset.go;state.dialog=null;location.hash=`d=${TEMPLATES[state.design].key}&s=${state.screen}`;render()});
 app.querySelectorAll("[data-doc]").forEach(e=>e.onclick=()=>{state.doc=+e.dataset.doc;state.screen="details";state.tab=0;render()});
 app.querySelectorAll("[data-tab]").forEach(e=>e.onclick=()=>{state.tab=+e.dataset.tab;render()});
 app.querySelectorAll("[data-dialog]").forEach(e=>e.onclick=()=>{state.dialog=e.dataset.dialog;render()});
 app.querySelectorAll("[data-close]").forEach(e=>e.onclick=()=>{state.dialog=null;render()});
 app.querySelectorAll("[data-ap]").forEach(e=>e.onclick=()=>{state.apSel=+e.dataset.ap;render()});
 app.querySelectorAll("[data-decide]").forEach(e=>e.onclick=()=>{state.approvals[state.apSel].state=e.dataset.decide;render()});
 app.querySelectorAll("[data-f]").forEach(e=>e.onchange=()=>{const [k,x]=e.dataset.f.split("|");state.filters[k][x]=e.checked;render()});
 const q=app.querySelector("#q");if(q){q.oninput=()=>{state.search=q.value;const pos=q.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)}}
 const drop=app.querySelector("[data-drop]");if(drop)drop.onclick=()=>{const f={name:["Service Agreement - Globex.pdf","Signed NDA - Acme.pdf","Invoice INV-1044.xlsx"][state.uploads.length%3],p:0};state.uploads.push(f);render();const iv=setInterval(()=>{f.p=Math.min(100,f.p+20);render();if(f.p>=100)clearInterval(iv)},250)};
}
function fromHash(){const m=Object.fromEntries(location.hash.slice(1).split("&").map(x=>x.split("=")));const i=TEMPLATES.findIndex(t=>t.key===m.d);if(i>=0)state.design=i;if(m.s&&SCREENS[m.s])state.screen=m.s;if(m.tab)state.tab=+m.tab;if(m.dialog)state.dialog=m.dialog;if(m.doc)state.doc=+m.doc}
window.addEventListener("hashchange",()=>{fromHash();render()});
fromHash();render();
</script>
</body>
</html>
